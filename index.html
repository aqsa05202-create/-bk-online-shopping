<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mela – Feed, Reels, Videos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2a1838;--mute:#7a6a85;--line:#eadfd0;--accent:#ff8a00;--teal:#0f8b7f;--onacc:#2a1838;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1024;--card:#26183400;--card:#261834;--ink:#f6ecff;--mute:#a995b8;--line:#3a2850;--teal:#34d1c0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1024;--card:#261834;--ink:#f6ecff;--mute:#a995b8;--line:#3a2850;--teal:#34d1c0;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;gap:4px;margin:0 auto}
nav button{padding:8px 16px;border-radius:99px;font-weight:600;color:var(--mute)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.create{background:var(--accent);color:var(--onacc);font-weight:800;padding:9px 16px;border-radius:99px}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--line)}
main{max-width:640px;margin:0 auto;padding:16px}
main.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.ph b{display:block;line-height:1.1}.ph small{color:var(--mute)}
.txt{padding:0 14px 12px;font-size:1.02rem;max-width:62ch}
.media{aspect-ratio:16/10;position:relative;overflow:hidden;background:#222}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.art{position:absolute;inset:0}
.art span{position:absolute;border-radius:50%;filter:blur(2px);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-24px) scale(1.25)}}
.acts{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.acts button{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mute)}
.acts button:hover{background:var(--line)}
.acts .on{color:#e5195b}
.cmts{padding:8px 14px 14px;border-top:1px solid var(--line)}
.cmts p{margin:6px 0;font-size:.95rem}
.cmts form{display:flex;gap:8px;margin-top:8px}
input[type=text],textarea{flex:1;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600}
.reels{height:calc(100dvh - 130px);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;max-width:420px;margin:0 auto;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;background:#222;color:#fff}
.reel .cap{position:absolute;left:16px;right:80px;bottom:20px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.reel .side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.reel .side button{width:52px;color:#fff;font-weight:600;font-size:.8rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.reel .side b{display:block;font-size:1.6rem}
.reel.paused .art span{animation-play-state:paused}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vid{text-align:left;display:block;width:100%}
.vid .media{border-radius:14px;aspect-ratio:16/9}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:.78rem;padding:2px 7px;border-radius:6px;z-index:2}
.vid h3{margin:8px 0 2px;font-size:1rem;line-height:1.25}.vid small{color:var(--mute)}
.watch .media{aspect-ratio:16/9;border-radius:16px}
.bar{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);z-index:2;width:0}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.play span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#2a1838;font-size:1.6rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(520px,92vw);padding:18px}
dialog::backdrop{background:rgba(20,8,30,.55)}
dialog h2{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:40;font-weight:600}
@media (max-width:560px){header{flex-wrap:wrap}nav{order:3;width:100%;justify-content:space-between}nav button{flex:1;padding:8px 6px}.create{margin-left:auto}}
.stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.stories button{display:grid;justify-items:center;gap:4px;font-size:.8rem;flex:none}.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--accent),#c2185b,var(--teal),var(--accent))}.ring .av{border:3px solid var(--bg)}
.sv{position:fixed;inset:0;z-index:50;display:grid;place-items:center;color:#fff;text-align:center;padding:30px;font-size:1.5rem;font-weight:800}
.msgs{height:calc(100dvh - 270px);min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}.m.me{align-self:flex-end;background:var(--accent);color:var(--onacc);border:0}.m small{display:block;color:var(--mute);font-size:.72rem}.m.me small{color:inherit;opacity:.7}
.chatf{display:flex;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.art span{animation:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Mela<i>.</i></div>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="feed">Feed</button>
    <button role="tab" data-tab="reels">Reels</button>
    <button role="tab" data-tab="videos">Videos</button>
    <button role="tab" data-tab="chat">Chat</button>
    <button role="tab" data-tab="ai">AI</button>
  </nav>
  <button class="theme" id="theme" aria-label="Toggle dark mode">◐</button>
  <button class="create" id="create">+ Create</button>
</header>
<main id="view"></main>

<dialog id="dlg">
  <h2>Create something</h2>
  <textarea id="newText" rows="4" placeholder="Share what’s on your mind…"></textarea>
  <div class="row"><button class="btn" id="aiCap" hidden>✨ Write with AI</button></div>
  <div class="row"><label>Add photo or video: <input type="file" id="newFile" accept="image/*,video/*"></label></div>
  <p style="color:var(--mute);font-size:.85rem;margin:0 0 10px">Videos you add also appear in Reels and Videos while this page is open.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel" style="background:var(--line);color:var(--ink)">Cancel</button><button class="btn" id="publish">Publish</button></div>
</dialog>

<script>
const COLORS=['#ff8a00','#0f8b7f','#c2185b','#5b3fd1','#d1a400','#1b6fd1'];
const GRAD=[['#ff8a00','#c2185b','#5b3fd1'],['#0f8b7f','#1b6fd1','#2a1838'],['#d1a400','#ff8a00','#c2185b'],['#5b3fd1','#0f8b7f','#ff8a00'],['#c2185b','#2a1838','#1b6fd1'],['#1b6fd1','#34d1c0','#d1a400']];
const people=['Ayesha Khan','Bilal Ahmed','Sana Malik','Usman Ali','Hira Noor','Danish Raza'];
let posts=[
 {id:'p1',who:0,time:'2h',text:'Subah ki chai aur Murree ka view. Zindagi mein aur kya chahiye?',g:0,likes:128,cm:[['Bilal','Wah! Kaunsi jagah hai?']]},
 {id:'p2',who:1,time:'5h',text:'Finally launched my first app. Six months of late nights, worth it.',g:1,likes:342,cm:[['Sana','Mubarak ho! 🎉'],['Usman','Link share karo']]},
 {id:'p3',who:2,time:'1d',text:'Biryani recipe thread: the secret is patience and a heavy pot.',g:2,likes:91,cm:[]},
 {id:'p4',who:3,time:'1d',text:'Cricket match tonight. Who’s watching?',g:3,likes:57,cm:[]}
];
let reels=[
 {id:'r1',who:4,text:'60-second pasta that actually works',g:4,likes:2400},
 {id:'r2',who:5,text:'Sunset timelapse from my rooftop',g:0,likes:1800},
 {id:'r3',who:0,text:'3 tips to learn faster, no fluff',g:1,likes:3100},
 {id:'r4',who:1,text:'Street food tour, part 1',g:2,likes:950}
];
let videos=[
 {id:'v1',who:3,title:'Learn JavaScript in 20 minutes',dur:'20:14',views:'48K views',g:3},
 {id:'v2',who:2,title:'Hunza valley: a 7 day road trip',dur:'12:40',views:'210K views',g:1},
 {id:'v3',who:4,title:'Home workout, no equipment',dur:'15:02',views:'96K views',g:2},
 {id:'v4',who:5,title:'How to start a small business',dur:'9:31',views:'33K views',g:4},
 {id:'v5',who:0,title:'Chai masala from scratch',dur:'6:18',views:'71K views',g:0},
 {id:'v6',who:1,title:'Build a website in one hour',dur:'58:00',views:'120K views',g:5}
];
let liked={},tab='feed',watching=null;
try{liked=JSON.parse(localStorage.getItem('mela-liked')||'{}')}catch(e){}
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('mela-liked',JSON.stringify(liked))}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function art(g){const c=GRAD[g%GRAD.length];return `<div class="art" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span style="width:55%;aspect-ratio:1;left:-8%;top:-10%;background:${c[2]};opacity:.55"></span><span style="width:40%;aspect-ratio:1;right:-6%;bottom:-8%;background:${c[0]};opacity:.7;animation-delay:-3s"></span><span style="width:22%;aspect-ratio:1;left:45%;top:40%;background:#fff;opacity:.25;animation-delay:-6s"></span></div>`}
function media(o){if(o.src){return o.kind==='video'?`<video src="${o.src}" controls loop muted playsinline></video>`:`<img src="${o.src}" alt="Uploaded photo">`}return art(o.g||0)}
function av(i){return `<div class="av" style="background:${COLORS[i%6]}">${people[i%6][0]}</div>`}
function likeBtn(id,n,label){const on=liked[id];return `<button class="${on?'on':''}" data-like="${id}" aria-pressed="${!!on}">${on?'♥':'♡'} ${n+(on?1:0)}${label||''}</button>`}

function renderFeed(){
 view.className='';
 view.innerHTML=storiesHtml()+posts.filter(p=>!q||p.text.toLowerCase().includes(q)).map(p=>`<article class="card" id="${p.id}">
  <div class="ph">${av(p.who)}<div><b>${esc(people[p.who%6])}</b><small>${p.time} ago</small></div></div>
  <div class="txt">${esc(p.text)}</div>
  ${(p.src||p.g!==undefined&&p.showMedia!==false)&&p.g!==undefined||p.src?`<div class="media">${media(p)}</div>`:''}
  <div class="acts">${likeBtn(p.id,p.likes)}<button data-cm="${p.id}">💬 ${p.cm.length}</button><button data-share="${p.id}">↗ Share</button></div>
  <div class="cmts" hidden>${p.cm.map(c=>`<p><b>${esc(c[0])}</b> ${esc(c[1])}</p>`).join('')}
   <form data-form="${p.id}"><input type="text" placeholder="Write a comment…" aria-label="Comment"><button class="btn">Send</button></form></div>
 </article>`).join('');
}
function renderReels(){
 view.className='';
 view.innerHTML=`<div class="reels">${reels.map(r=>`<section class="reel" data-reel>
  ${r.src?`<video src="${r.src}" autoplay loop muted playsinline controls style="width:100%;height:100%;object-fit:cover"></video>`:art(r.g)}
  <div class="cap"><b>@${esc(people[r.who%6].split(' ')[0].toLowerCase())}</b><div>${esc(r.text)}</div></div>
  <div class="side">${likeBtn(r.id,r.likes).replace('<button','<button style="font-size:1.1rem"')}<button data-share="${r.id}"><b>↗</b>Share</button></div>
 </section>`).join('')}</div>
 <p style="text-align:center;color:var(--mute);font-size:.85rem">Scroll for the next reel. Tap a reel to pause the motion.</p>`;
}
function renderVideos(){
 view.className='wide';
 if(watching){const v=videos.find(x=>x.id===watching);
  view.innerHTML=`<div class="watch" style="max-width:860px;margin:0 auto"><button class="btn" data-back style="margin-bottom:12px">← All videos</button>
   <div class="media">${v.src?`<video src="${v.src}" controls autoplay playsinline></video>`:art(v.g)+'<div class="play" data-play><span>▶</span></div><div class="bar" id="bar"></div>'}</div>
   <h2 style="margin:12px 0 4px">${esc(v.title)}</h2><small style="color:var(--mute)">${v.views}</small>
   <div class="row">${av(v.who)}<b>${esc(people[v.who%6])}</b><button class="btn" data-sub style="margin-left:auto">Subscribe</button>${likeBtn(v.id,420)}<button class="btn" data-share="${v.id}" style="background:var(--line);color:var(--ink)">↗ Share</button></div></div>`;return}
 view.innerHTML=`<div class="grid">${videos.map(v=>`<button class="vid" data-open="${v.id}"><div class="media">${media(v)}<span class="dur">${v.dur}</span></div><h3>${esc(v.title)}</h3><small>${esc(people[v.who%6])} · ${v.views}</small></button>`).join('')}</div>`;
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
 ({feed:renderFeed,reels:renderReels,videos:renderVideos,chat:renderChat,ai:renderAI})[tab]();
}
function find(id){return posts.find(x=>x.id===id)||reels.find(x=>x.id===id)||videos.find(x=>x.id===id)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-reel]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;watching=null;render();window.scrollTo(0,0)}
 else if(t.dataset.like){const id=t.dataset.like;liked[id]=!liked[id];save();render()}
 else if(t.dataset.cm){const c=t.closest('article').querySelector('.cmts');c.hidden=!c.hidden;if(!c.hidden)c.querySelector('input').focus()}
 else if(t.dataset.share){try{navigator.clipboard.writeText(location.href.split('#')[0]+'#'+t.dataset.share)}catch(x){}toast('Link copied')}
 else if(t.dataset.open){watching=t.dataset.open;render();window.scrollTo(0,0)}
 else if('back' in t.dataset){watching=null;render()}
 else if('sub' in t.dataset){const on=t.textContent==='Subscribe';t.textContent=on?'Subscribed ✓':'Subscribe';if(on)toast('Subscribed')}
 else if(t.id==='theme'){const d=document.documentElement,dark=getComputedStyle(d).colorScheme==='dark';d.dataset.theme=dark?'light':'dark'}
 else if(t.id==='create'){$('#dlg').showModal()}
 else if(t.id==='cancel'){$('#dlg').close()}
 else if(t.id==='publish'){publish()}
});
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-play]');
 if(p){p.remove();const bar=$('#bar');let w=0;const iv=setInterval(()=>{if(!document.body.contains(bar)||w>=100){clearInterval(iv);return}w+=.5;bar.style.width=w+'%'},100)}
 const r=e.target.closest('[data-reel]');if(r&&!e.target.closest('button,video'))r.classList.toggle('paused');
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.dataset.form;if(!id)return;
 const i=e.target.querySelector('input');if(!i.value.trim())return;
 find(id).cm.push(['You',i.value.trim()]);const open=id;render();
 const c=document.getElementById(open).querySelector('.cmts');c.hidden=false;
});
function publish(){
 const text=$('#newText').value.trim(),f=$('#newFile').files[0];
 if(!text&&!f){toast('Write something or add a file first');return}
 const o={id:'u'+Date.now(),who:0,time:'Just now',text:text||'New upload',likes:0,cm:[]};
 if(f){o.src=URL.createObjectURL(f);o.kind=f.type.startsWith('video')?'video':'image';
  if(o.kind==='video'){reels.unshift({id:o.id+'r',who:0,text:o.text,likes:0,src:o.src});videos.unshift({id:o.id+'v',who:0,title:o.text.slice(0,60),dur:'New',views:'0 views',g:0,src:o.src})}}
 else o.g=Math.floor(Math.random()*6);
 if(!f)delete o.g;
 posts.unshift(o);$('#newText').value='';$('#newFile').value='';$('#dlg').close();tab='feed';render();toast('Published');
}
let q='',chat=[],room=null,sample=null,aiLog=[];
const myName='Guest'+Math.floor(100+Math.random()*900);
const SYS='You are Mela AI, a friendly assistant inside a social app. Reply briefly, in the same language the user writes (Roman Urdu or English).\n\n';
function storiesHtml(){return `<div class="stories">${people.map((n,i)=>`<button data-story="${i}"><span class="ring"><span class="av" style="background:${COLORS[i]}">${n[0]}</span></span>${esc(n.split(' ')[0])}</button>`).join('')}</div><input type="text" id="search" placeholder="Search posts…" value="${esc(q)}" aria-label="Search posts" style="margin-bottom:14px">`}
const storyText=['Chai time ☕','New project loading…','Weekend plans?','Match day!','Fresh bake today','Morning run done'];
function msgs(list,empty){return list.length?list.map(m=>`<div class="m ${m.me?'me':''}"><small>${esc(m.n)}</small>${esc(m.t)}</div>`).join(''):`<p style="color:var(--mute);text-align:center">${empty}</p>`}
function renderChat(){view.className='';
 view.innerHTML=`<h2 style="margin:0 0 8px">Live chat</h2><small style="color:var(--mute)">${room?'Everyone with this page open right now can see your messages.':'Live chat connects when this page is open on claude.ai.'}</small><div class="msgs" id="msgs">${msgs(chat,'No messages yet. Say salaam!')}</div><form class="chatf" id="chatf"><input type="text" placeholder="Type a message…" aria-label="Message"${room?'':' disabled'}><button class="btn"${room?'':' disabled'}>Send</button></form>`;
 const b=$('#msgs');b.scrollTop=b.scrollHeight}
function renderAI(){view.className='';
 view.innerHTML=`<h2 style="margin:0 0 8px">Mela AI ✨</h2><small style="color:var(--mute)">${sample?'Ask for caption ideas, video scripts, or advice.':'AI works when this page is open on claude.ai.'}</small><div class="msgs" id="msgs">${msgs(aiLog.map(m=>({me:m.role==='user',n:m.role==='user'?'You':'Mela AI',t:m.content})),'Try: “Mere reel ke liye 3 caption do”')}</div><form class="chatf" id="aif"><input type="text" placeholder="Ask Mela AI…" aria-label="Ask AI"${sample?'':' disabled'}><button class="btn"${sample?'':' disabled'}>Ask</button></form>`;
 const b=$('#msgs');b.scrollTop=b.scrollHeight}
async function askAI(t){aiLog.push({role:'user',content:t});const a={role:'assistant',content:'…'};const hist=aiLog.map((m,i)=>i?m:{role:'user',content:SYS+m.content});aiLog.push(a);renderAI();
 try{const r=await sample(hist,{cache:false,onText:({text})=>{a.content=text;if(tab==='ai')renderAI()}});a.content=r.text}catch(e){a.content=e&&e.code==='not_granted'?'AI permission was declined.':'AI is busy, try again soon.'}
 if(tab==='ai')renderAI()}
document.addEventListener('submit',e=>{const id=e.target.id;if(id!=='chatf'&&id!=='aif')return;e.preventDefault();const i=e.target.querySelector('input'),t=i.value.trim();if(!t)return;i.value='';
 if(id==='aif'){askAI(t);return}
 chat.push({n:myName,t,me:true});try{room.emit('msg',{n:myName,t})}catch(x){}renderChat()},true);
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value.toLowerCase();const p=e.target.selectionStart;renderFeed();const s=$('#search');s.focus();s.setSelectionRange(p,p)}});
document.addEventListener('click',async e=>{
 const s=e.target.closest('[data-story]');
 if(s){const i=+s.dataset.story,c=GRAD[i%6],d=document.createElement('div');d.className='sv';d.style.background=`linear-gradient(160deg,${c[0]},${c[1]},${c[2]})`;d.innerHTML=`<div>${esc(people[i])}<br><span style="font-weight:600;font-size:1.1rem">${storyText[i]}</span></div>`;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),4000);return}
 if(e.target.id==='aiCap'&&sample){const b=e.target,idea=$('#newText').value.trim()||'a fun everyday moment';b.textContent='Writing…';
 try{const r=await sample('Write one catchy social media post (max 30 words, add 1-2 emojis) about this idea. Use the same language as the idea. Reply with the post only.\n\nIdea: '+idea,{cache:false});$('#newText').value=r.text.trim()}catch(x){toast('AI is unavailable right now')}b.textContent='✨ Write with AI'}
});
if(window.claude){
 claude.use('sample').then(s=>{sample=s;if(s)$('#aiCap').hidden=false;if(tab==='ai')render()}).catch(()=>{});
 claude.use('room').then(r=>{if(!r)return;room=r;r.on('msg',d=>{if(d&&d.t){chat.push({n:String(d.n||'Guest').slice(0,30),t:String(d.t).slice(0,500)});if(tab==='chat')renderChat()}});if(tab==='chat')render()}).catch(()=>{});
}
render();
</script>
